name: JITTest
options:
  bundleIdPrefix: com.jacksonyarger
  deploymentTarget:
    iOS: "16.0"
targets:
  JITTest:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - target: JITHelper
        embed: true
      - target: TunnelExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacksonyarger.jittest
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: JITTest.entitlements
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        EX_ENABLE_EXTENSION_POINT_GENERATION: YES
    info:
      path: Generated-Info.plist
      properties:
        LSApplicationQueriesSchemes:
          - stikdebug
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

  StikJIT:
    type: framework
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: Vendor/StikJIT-src/Sources
      - path: Vendor/StikJIT-src/Resources
        buildPhase: resources
    dependencies:
      - sdk: JavaScriptCore.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: CFNetwork.framework
      - sdk: SystemConfiguration.framework
      - sdk: IOKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacksonyarger.jittest.StikJIT
        PRODUCT_NAME: StikJIT
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        SKIP_INSTALL: NO
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Vendor/StikJIT-src/idevice $(SRCROOT)/Vendor/StikJIT-src/iokit"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/StikJIT-src/idevice $(SRCROOT)/Vendor/StikJIT-src/iokit"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Vendor/StikJIT-src/idevice"
        OTHER_LDFLAGS: "-force_load $(SRCROOT)/Vendor/StikJIT-src/idevice/libidevice_ffi.a"
        CODE_SIGN_STYLE: Automatic

  JITHelper:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: HelperExtension
      - path: Sources/JITBridge
    dependencies:
      - target: StikJIT
        embed: true
      - sdk: ExtensionFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacksonyarger.jittest.JITHelper
        PRODUCT_NAME: JITHelper
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HelperExtension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        EX_ENABLE_EXTENSION_POINT_GENERATION: YES
        CODE_SIGN_STYLE: Automatic

  TunnelExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TunnelExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacksonyarger.jittest.TunnelExtension
        PRODUCT_NAME: TunnelExtension
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TunnelExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: TunnelExtension/TunnelExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
